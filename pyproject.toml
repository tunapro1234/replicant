[project]
name = "pyreplicant"
version = "0.4.0"
description = "Run behavioral-economics experiments with LLM agents as subjects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tuna Gül"},
]
keywords = [
    "behavioral economics",
    "LLM agents",
    "experimental economics",
    "oTree",
    "Homo Silicus",
    "Big Five",
    "persona",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# oTree server (for running the bundled experiment apps locally)
otree = ["otree>=6.0"]

[project.urls]
Homepage = "https://github.com/tunapro1234/replicant"
Repository = "https://github.com/tunapro1234/replicant"
Issues = "https://github.com/tunapro1234/replicant/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["replicant*"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
