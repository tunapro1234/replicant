# Example experiment config for scripts/run_game.py
#   python scripts/run_game.py --config config.yaml
# Any CLI flag (e.g. --reps 20) overrides the matching value here.

game: dictator                    # which game (must be a registered oTree app)
model: google/gemma-4-31b-it      # any OpenRouter model id
reps: 10                          # repetitions; >1 gives mean +/- 95% CI and saves results
seed: 42                          # base seed (rep i uses seed+i) for reproducibility
temperature: 1.0                  # LLM sampling temperature

# persona-injection method: baseline | homo_silicus | personallm
method: homo_silicus

# for method=homo_silicus — which theory/political persona:
persona: self_interested          # self_interested | inequity_averse | efficient |
                                  # socialist | leftist | liberal | moderate |
                                  # libertarian | conservative

# for method=personallm — Big Five scores (uncomment, 1-5):
# big5: "E=4,A=1,C=3,N=4,O=3"

# or a sampled Big Five individual from population norms:
# persona:
#   type: big5
#   seed: 42
